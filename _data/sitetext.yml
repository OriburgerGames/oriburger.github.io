# 사이트에 표시되는 모든 텍스트. 최상위 키는 _config.yml의 locale과 일치해야 한다.
# 템플릿에서는 site.data.sitetext[site.locale].<섹션>.<키> 로 참조한다.
# desc / body / subtext 필드는 Markdown을 지원한다.
en:
  header:
    title: Oriburger Games
    text: FOR THE BEST ACTION GAME
    button: MORE INFO
    buttonlink: "#services"

  services:
    title: "About BackStreet"
    text: "3D Back-View Action Roguelite"
    section: services
    video: Tm9JOkwG1w4 # YouTube 영상 ID. 비워두면 영상 영역이 표시되지 않는다.
    # 아이콘: https://fontawesome.com/icons
    list:
      - title: "Fast-Paced Combat"
        desc: "Engage in a combo-based, high-speed combat system that lets you counter a wide variety of enemy patterns."
        icon: fas fa-bolt
      - title: "Roguelite Growth"
        desc: "Customize your combat style with Boosterchips and battle applications earned from defeating enemies, creating a unique build every run."
        icon: fas fa-microchip
      - title: "Post-Apocalyptic World"
        desc: "Experience a journey to uncover the protagonist’s identity in a city dominated by the AI overlord 3COS and corrupted machines."
        icon: fas fa-robot

  # 수상 내역 항목 자체는 _portfolio/*.md 에서 관리한다.
  portfolio:
    title: "Awards"
    text: "Achievements and recognitions earned over time."
    section: portfolio
    closebutton: "Close"

  timeline:
    title: "Timeline"
    text: "Our journey and milestones"
    section: timeline
    # 패널은 좌/우로 번갈아 배치된다. start_align 으로 첫 항목의 위치를, 각 항목의 align 으로 강제 지정할 수 있다.
    #start_align: "left"
    # image 대신 icon(Font Awesome 클래스)을 지정하면 원 안에 아이콘이 표시된다.
    events:
      - title: "Project Kickoff"
        year: "2022"
        desc: "The BackStreet project officially began within Soongsil University’s game development club *Gammaru*, laying the foundation for future development."
        image: assets/img/timeline/1.jpg
        alt: "Kickoff"
      - title: "Founding Team Formation"
        year: "October 2024"
        desc: "The core founding team was formed, bringing together diverse expertise and vision."
        image: assets/img/timeline/2.jpg
        alt: "Pre-Startup"
      - title: "KOCCA Startup Support"
        year: "April 2025"
        desc: "Selected for the KOCCA Preliminary Startup Support Program, gaining recognition and resources for growth."
        image: assets/img/timeline/3.jpg
        alt: "KOCCA support"
      - title: "Smilegate Membership 17th Cohort"
        year: "July 2025"
        desc: "Chosen as part of Smilegate Membership 17th cohort, expanding opportunities for collaboration and mentorship."
        image: assets/img/timeline/4.jpg
        alt: "Smilegate membership"
      - title: "Oriburger Games Launched"
        year: "Q2, 2026"
        desc: "The team officially launched as **Oriburger Games**, taking the next step from a student project to an independent studio devoted to creating the ultimate action game."
        icon: fas fa-rocket
        alt: "Oriburger Games launch"
      - title: "BackStreet Early Access"
        year: "Q1, 2027"
        desc: "Scheduled for release on Steam Early Access in Q1 2027, marking the beginning of BackStreet’s journey with players worldwide."
        image: assets/img/timeline/5.jpg
        alt: "BackStreet Early Access"
    end: "Be Part <br> of Our <br> Story!"

  about:
    title: "About Us"
    text: "The Journey of Oriburger Games"
    body: "**Oriburger Games** is a team that strives to create the ultimate action game while fostering a culture of growth and collaboration. Since its founding in 2024, the team has continued to achieve remarkable results and build a strong track record. Looking ahead, Oriburger Games is preparing to launch *BackStreet* in Early Access in the first quarter of 2027, marking an exciting milestone in its journey. At the same time, the team is actively seeking global partners to expand its reach and bring its vision to players around the world."
    section: about

  clients:
    section: clients
    max-height: 100px
    horizontal-scrolling: "no" # "yes" 로 바꾸면 가로 스크롤 목록으로 표시
    list:
      - title: "KOCCA"
        url: https://www.kocca.kr/kocca/main.do
        logo: assets/img/clients/kocca.png
      - title: "Smilegate"
        url: https://futurelab.center/
        logo: assets/img/clients/smilegate.png
      - title: "Soongsil University"
        url: https://ssu.ac.kr/
        logo: assets/img/clients/soongsiluniversity.jpg

  team:
    title: "OUR AMAZING TEAM"
    text: "Meet the people behind BackStreet."
    subtext: "We are **Oriburger Games** — a group of passionate creators united by the vision of building the *ultimate action roguelite experience*.  Each member brings unique expertise, from **game design** and **programming** to **art** and **storytelling**, and together we foster a culture of *growth*, *creativity*, and *collaboration*."
    section: team
    # image 를 생략하면 이름 이니셜로 된 아바타가 표시된다.
    # social 은 실제 프로필 URL이 있을 때만 추가한다.
    people:
      - name: "Jaewon Park"
        role: "Lead Designer"
        image: assets/img/team/1.png
      - name: "Jaeho Lee"
        role: "Founder, Programmer"
        image: assets/img/team/2.png
        social:
          - url: https://www.linkedin.com/in/backstreetjaeho/
            icon: fab fa-linkedin-in
      - name: "Yuho Hwang"
        role: "Lead Programmer"
        image: assets/img/team/3.png
      - name: "Younghun Park"
        role: "Programmer"
        image: assets/img/team/4.png

  contact:
    title: "Contact Us"
    text: "Have questions or want to collaborate? Reach out to Oriburger Games and we’ll get back to you soon."
    section: contact
    name: "Name*"
    name-validation: "Please enter your name."
    email: "Email*"
    email-validation: "Please enter your email address."
    phone: "Phone Number"
    message: "Message*"
    message-validation: "Please enter a message."
    subject: "BackStreet Contact Form Submission"
    submit: "Send Message"

  footer:
    legal: "Privacy Policy"
    social:
      - url: https://x.com/BS_BackStreet
        icon: "fab fa-twitter"
      - url: https://www.instagram.com/team_backstreet/
        icon: "fab fa-instagram"
      - url: https://store.steampowered.com/app/3121410/BackStreet/
        icon: "fab fa-steam"
      - url: https://discord.com/invite/swFU4BSeUr
        icon: "fab fa-discord"
      - url: https://teambackstreet.notion.site/?source=copy_link
        icon: "fas fa-book"
