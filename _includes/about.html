{%- assign text = site.data.sitetext[site.locale] | default: site.data.sitetext -%}
{%- assign about = text.about -%}
<!-- About -->
<section class="page-section" id="{{ about.section | default: "about" }}">
  <div class="container">
    <div class="row">
      <div class="col-lg-12 text-center reveal">
        <h2 class="section-heading text-uppercase">{{ about.title | default: "About Us" }}</h2>
        <h3 class="section-subheading text-muted">{{ about.text }}</h3>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-8 mx-auto text-center reveal" style="--reveal-delay: 150ms">
        <div class="lead-text text-muted">{{ about.body | markdownify }}</div>
      </div>
    </div>
  </div>
</section>
<!-- End About -->
