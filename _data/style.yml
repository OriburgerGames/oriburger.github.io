# 스타일 설정. 값이 없으면 각 항목의 기본값이 쓰인다.

# 강조색 (버튼, 링크, 아이콘 등). 기본 "#fed136"
#highlight: "#54bfff"

# 배경 이미지 (assets/css/agency.css 기준 상대 경로)
header-image: "../img/header.png"
contact-image: "../img/contact.png"

# 수상 항목 위에 마우스를 올렸을 때 표시할 Font Awesome 아이콘. 기본 "fas fa-plus fa-3x"
#portfolio-icon: fas fa-expand-arrows-alt fa-3x

# 웹폰트. 실제 font-family 매핑은 _sass/base/_mixins.scss 에 있다.
# (Wuinbold 은 assets/fonts 의 로컬 폰트)
fonts_urls:
  - "https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap"
  - "https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic&display=swap"
  - "https://fonts.googleapis.com/css?family=Roboto+Slab:300,400,700&display=swap"
